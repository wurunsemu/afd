<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>Fizyoterapist Paneli</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#0F172A;--bg2:#1E293B;--bg3:#334155;--txt1:#F1F5F9;--txt2:#94A3B8;--txt3:#7C8BA1;--brd:#334155;
  --acc:#14B8A6;--grn:#10B981;--yel:#F59E0B;--red:#EF4444;--blu:#3B82F6;--pur:#8B5CF6;--org:#F97316;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--ease-out:cubic-bezier(.22,1,.36,1)
}
html,body{height:100%;background:var(--bg1);color:var(--txt1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
button,input,select,textarea{font-family:inherit}
.app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
.topbar{background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.badge-logo{width:32px;height:32px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.content{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;padding:16px 16px calc(16px + var(--safe-bot));display:none;flex-direction:column;gap:14px}
.panel.active{display:flex}
.nav{background:var(--bg2);border-top:1px solid var(--brd);display:flex;flex-shrink:0;padding-bottom:var(--safe-bot)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--txt3);font-size:.68rem;position:relative}
.nav-btn .ico{font-size:1.3rem;position:relative;z-index:1}
.nav-btn::before{content:'';position:absolute;top:5px;left:50%;width:56px;height:30px;margin-left:-28px;border-radius:15px;background:#14B8A622;opacity:0;transition:opacity .25s}
.nav-btn.active{color:var(--acc)}.nav-btn.active::before{opacity:1}
.nav-badge{position:absolute;top:4px;right:calc(50% - 24px);background:var(--red);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:14px}
.card-title{font-size:.8rem;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.page-title{color:var(--acc);font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field{background:var(--bg3);border:1px solid var(--brd);border-radius:8px;padding:9px;color:var(--txt1);font-size:.9rem;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
label.lbl{display:block;font-size:.72rem;color:var(--txt2);margin-bottom:4px}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s,scale .12s}
.btn:active{scale:.97}.btn:disabled{opacity:.5}
.btn.outline{background:transparent;border:1px solid var(--brd);color:var(--txt1)}
.btn.full{width:100%}.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:8px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--txt2);padding:10px 6px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg1);color:var(--txt1);box-shadow:0 1px 4px #0006}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--brd);background:var(--bg3);color:var(--txt1);border-radius:18px;padding:7px 12px;font-size:.8rem;cursor:pointer;transition:background-color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--c,#14B8A6);border-color:var(--c,#14B8A6);color:#fff}
.cat{border-left:3px solid var(--c);padding-left:10px;margin-bottom:12px}
.cat-h{font-size:.78rem;font-weight:700;color:var(--c);margin-bottom:6px}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resp button{border:1px solid var(--brd);background:var(--bg3);color:var(--txt1);border-radius:10px;padding:10px;font-size:.85rem;cursor:pointer}
.resp button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item-h{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600}
.item-m{font-size:.75rem;color:var(--txt2);margin-top:3px}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin:2px 4px 0 0;color:#fff;background:var(--c,#64748B)}
.empty{text-align:center;color:var(--txt3);padding:20px;font-size:.85rem}
.toast{position:fixed;bottom:calc(76px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:10px 18px;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center;z-index:999}
.toast.err{border-color:var(--red)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.login{position:fixed;inset:0;background:var(--bg1);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login input{text-align:center;padding:12px;font-size:1rem}
.loading{position:fixed;inset:0;background:#0F172Acc;display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:4px solid var(--bg3);border-top-color:var(--acc);border-radius:50%}
@media (prefers-reduced-motion: no-preference){
  .spinner{animation:spin .8s linear infinite}
  .panel.active>*{animation:fade-up .35s var(--ease-out) both}
  .login form>*{animation:fade-up .45s var(--ease-out) both}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>

<div class="login" id="loginWrap">
  <form onsubmit="doLogin(event)">
    <div style="font-size:3rem">🩺</div>
    <div style="font-size:1.4rem;font-weight:800">Fizyoterapist Paneli</div>
    <div style="font-size:.85rem;color:var(--txt2)">Uygulama yanıtları ve sinyal bildirimi</div>
    <input class="field" id="loginName" placeholder="Ad Soyad" autocomplete="name" aria-label="Ad Soyad">
    <input class="field" id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (4-6 rakam)" autocomplete="current-password" aria-label="PIN">
    <button class="btn full" type="submit">Giriş Yap</button>
    <div style="font-size:.75rem;color:var(--txt3);line-height:1.5">İlk girişte PIN'inizi siz belirlersiniz.<br>Adınız listede yoksa diyetisyene başvurun.</div>
    <div id="loginError" role="alert" style="font-size:.82rem;color:var(--red);min-height:18px"></div>
  </form>
</div>
<div class="loading" id="loading"><div class="spinner"></div><div id="loadingMsg" style="font-size:.85rem;color:var(--txt2)"></div></div>
<div class="toast" id="toast" role="status"></div>

<div class="app" id="mainApp" style="display:none">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <div class="badge-logo">🩺</div>
      <div style="min-width:0"><div id="meName" style="font-weight:700;font-size:.95rem"></div><div style="font-size:.72rem;color:var(--txt2)">Fizyoterapist</div></div>
    </div>
    <div style="text-align:right"><div id="today" style="font-size:.75rem;color:var(--txt3)"></div>
      <button onclick="doLogout()" style="background:none;border:none;color:var(--txt2);font-size:.72rem;cursor:pointer;padding:4px 0">Çıkış</button></div>
  </div>

  <div class="content">
    <!-- YENİ KAYIT -->
    <div class="panel active" id="panel-new">
      <div class="page-title">Yeni Kayıt</div>
      <div class="card">
        <label class="lbl" for="athleteInput">Sporcu</label>
        <input class="field" id="athleteInput" list="athleteList" placeholder="Sporcu adını yazın…" autocomplete="off" oninput="athleteChanged()">
        <datalist id="athleteList"></datalist>
        <div id="athleteHint" style="font-size:.72rem;color:var(--txt3);margin-top:4px"></div>
        <div class="grid2" style="margin-top:10px">
          <div><label class="lbl" for="repDate">Tarih</label><input class="field" type="date" id="repDate"></div>
          <div><label class="lbl">Kayıt türü</label>
            <div class="seg" role="group" aria-label="Kayıt türü">
              <button type="button" id="tipU" aria-pressed="true" onclick="setTip('uygulama')">🧊 Uygulama</button>
              <button type="button" id="tipS" aria-pressed="false" onclick="setTip('sinyal')">🚩 Sinyal</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card" id="uygulamaCard">
        <div class="card-title">Uygulama ve sporcunun yanıtı</div>
        <div class="grid2">
          <div><label class="lbl" for="uType">Uygulama</label><select class="field" id="uType"></select></div>
          <div><label class="lbl" for="uRegion">Bölge</label><select class="field" id="uRegion"></select></div>
          <div><label class="lbl" for="uDur">Süre (dk)</label><input class="field" type="number" id="uDur" min="1" max="60" inputmode="decimal"></div>
          <div><label class="lbl" for="uTemp">Sıcaklık (°C)</label><input class="field" type="number" id="uTemp" inputmode="decimal"></div>
        </div>
        <label class="lbl" style="margin-top:12px">Sporcunun uygulamaya yanıtı</label>
        <div class="resp" id="respBtns"></div>
      </div>

      <div class="card">
        <div class="card-title" id="sigTitle">Gözlenen sinyaller <span style="text-transform:none;font-weight:400">(varsa)</span></div>
        <div id="sigGroups"></div>
        <label class="lbl" style="margin-top:4px">Şiddet</label>
        <div class="seg" role="group" aria-label="Şiddet" id="sevSeg">
          <button type="button" data-v="1" aria-pressed="false" onclick="setSev(1)">Hafif</button>
          <button type="button" data-v="2" aria-pressed="false" onclick="setSev(2)">Orta</button>
          <button type="button" data-v="3" aria-pressed="false" onclick="setSev(3)">Ciddi</button>
        </div>
      </div>

      <div class="card">
        <label class="lbl" for="repNote">Not (sporcunun söyledikleri, gözleminiz)</label>
        <textarea class="field" id="repNote" rows="3" maxlength="1000" placeholder="Ör. “Soğuk suya girmekten çekiniyor, maç öncesi uyuyamadığını söyledi.”"></textarea>
        <button class="btn full" style="margin-top:12px" id="submitBtn" onclick="submitReport()">📨 Diyetisyene Gönder</button>
      </div>
    </div>

    <!-- SORULAR -->
    <div class="panel" id="panel-q">
      <div class="page-title">Diyetisyenin Soruları</div>
      <div id="qOpen"></div>
      <div class="card"><div class="card-title">Yanıtlanmış</div><div id="qDone"></div></div>
    </div>

    <!-- GEÇMİŞ -->
    <div class="panel" id="panel-h">
      <div class="page-title">Gönderdiklerim (son 14 gün)</div>
      <div class="card"><div id="hist"></div></div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-new" onclick="switchPanel('new')"><span class="ico">➕</span>Yeni Kayıt</button>
    <button class="nav-btn" id="nav-q" onclick="switchPanel('q')"><span class="ico">💬</span>Sorular<span class="nav-badge" id="qBadge" style="display:none"></span></button>
    <button class="nav-btn" id="nav-h" onclick="switchPanel('h')"><span class="ico">🕘</span>Geçmiş</button>
  </nav>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzITFfpC8EZ67uesNrH4P3Y3xhrq1UO0TvGSXyhsdSe6UgALG4m7rjY70mGawuaBSv5MA/exec';
const TEAM_SECRET = 'YA2026';
const SESSION_KEY = 'fz_session_v1';

// Panel ile ortak sinyal kataloğu (kodlar aynı olmalı)
const SIGNALS = {
  psikolojik: { label:'🧠 Psikolojik', color:'#8B5CF6', items:{ ruh_hali:'Ruh hali düşük', motivasyon:'Motivasyon kaybı', kaygi:'Kaygı / stres', uyku:'Uyku sorunu', sakatlik_korkusu:'Sakatlık korkusu', icine_kapanma:'İçine kapanma / takımdan uzaklaşma' } },
  beslenme:   { label:'🍽️ Beslenme davranışı', color:'#F97316', items:{ istah_azalma:'İştah azalması', istah_artis:'Aşırı yeme', ogun_atlama:'Öğün atlama', kilo_kaygisi:'Kilo / beden kaygısı', kisitlama:'Kısıtlayıcı yeme', sindirim:'Sindirim şikâyeti' } },
  fiziksel:   { label:'💪 Fiziksel', color:'#3B82F6', items:{ agri:'Ağrı', gerginlik:'Kas gerginliği', sakatlik:'Sakatlık / şüphesi', toparlanma:'Toparlanmada gecikme', yorgunluk:'Aşırı yorgunluk' } },
  uygulama:   { label:'🧊 Uygulamaya yanıt', color:'#14B8A6', items:{ tolerans_dusuk:'Soğuğa düşük tolerans', uygulama_kaygisi:'Uygulamadan kaçınma / kaygı' } }
};
const APPS = { cwi:'🧊 Buz banyosu (CWI)', cryo:'❄️ Kriyoterapi (WBC)', kontrast:'🚿 Kontrast duş', buz_paketi:'🩹 Buz paketi (lokal)', sicak:'♨️ Sıcak uygulama' };
const REGIONS = { tam_vucut:'Tüm vücut', bacak:'Bacak / quadriseps', diz:'Diz', omuz:'Omuz / üst ekstremite', sirt:'Sırt / lumbar', diger:'Diğer' };
const RESPONSES = { rahatladi:['😌 Rahatladı', '#10B981'], notr:['😐 Nötr', '#64748B'], rahatsiz:['😣 Rahatsız oldu', '#F59E0B'], reddetti:['🙅 Reddetti', '#EF4444'] };
const FOLLOW = { yeni:['Yeni', '#3B82F6'], izleniyor:['İzleniyor', '#F59E0B'], mudahale:['Müdahale planlandı', '#F97316'], yonlendirildi:['Uzmana yönlendirildi', '#8B5CF6'], kapandi:['Kapandı', '#10B981'] };

let me = null, athletes = [], tip = 'uygulama', resp = '', sev = 0, picked = new Set(), questions = [], answeringFor = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const daysAgo = n => { const d = new Date(Date.now() - n * 86400000); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const norm = s => String(s || '').toLocaleLowerCase('tr-TR').normalize('NFC').replace(/\s+/g, ' ').trim();
let _tt;
function toast(msg, err) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), err ? 4500 : 2800); }
function loading(on, msg) { document.getElementById('loading').style.display = on ? 'flex' : 'none'; if (msg) document.getElementById('loadingMsg').textContent = msg; }

async function getAPI(params) {
  const u = new URL(API_URL); u.searchParams.set('secret', TEAM_SECRET);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== '') u.searchParams.set(k, v); });
  const r = await fetch(u.toString()); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function postAPI(params) {
  const body = Object.assign({ secret: TEAM_SECRET }, params);
  if (me) { body.physioId = me.id; body.token = me.token; }
  const r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j.ok && /Oturum geçersiz/.test(j.error || '')) { toast(j.error, true); setTimeout(doLogout, 1500); }
  return j;
}

// ── Giriş ──
async function doLogin(ev) {
  ev.preventDefault();
  const name = document.getElementById('loginName').value, pin = document.getElementById('loginPin').value.trim();
  const err = document.getElementById('loginError'); err.textContent = '';
  if (!name.trim()) { err.textContent = 'Adınızı yazın'; return; }
  if (!/^\d{4,6}$/.test(pin)) { err.textContent = 'PIN 4-6 haneli rakam olmalı'; return; }
  loading(true, 'Giriş yapılıyor…');
  try {
    const list = await getAPI({ action:'getPhysios' });
    if (!list.ok) throw new Error(list.error);
    const m = (list.data || []).filter(f => norm(f.Ad) === norm(name));
    if (!m.length) { err.textContent = 'Bu isimde fizyoterapist kayıtlı değil. Diyetisyenden sizi eklemesini isteyin.'; return; }
    const r = await postAPI({ action:'physioLogin', physioId: m[0].ID, pin });
    if (!r.ok) { err.textContent = r.error; return; }
    me = { id: String(r.data.ID), name: r.data.Ad, token: r.data.token };
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(me)); } catch (e) {}
    document.getElementById('loginPin').value = '';
    launch();
    if (r.data.firstLogin) toast('🔐 PIN kaydedildi. Sonraki girişlerde bu PIN\'i kullanın.');
  } catch (e) { err.textContent = 'Bağlantı hatası: ' + e.message; }
  finally { loading(false); }
}
function doLogout() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  me = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
}
async function launch() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('meName').textContent = me.name;
  document.getElementById('today').textContent = new Date().toLocaleDateString('tr-TR', { day:'numeric', month:'long', weekday:'short' });
  document.getElementById('repDate').value = todayISO();
  buildForm();
  try {
    const a = await getAPI({ action:'getAthletes' });
    athletes = (a.data || []).map(x => ({ id: String(x.ID), name: x.Ad, pos: x.Mevki || '' }));
    document.getElementById('athleteList').innerHTML = athletes.map(x => `<option value="${esc(x.name)}">${esc(x.pos)}</option>`).join('');
  } catch (e) { toast('Sporcu listesi alınamadı: ' + e.message, true); }
  loadQuestions();
}

// ── Form ──
function buildForm() {
  document.getElementById('uType').innerHTML = Object.entries(APPS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  document.getElementById('uRegion').innerHTML = Object.entries(REGIONS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  document.getElementById('respBtns').innerHTML = Object.entries(RESPONSES).map(([k, [l, c]]) => `<button type="button" style="--c:${c}" aria-pressed="false" data-v="${k}" onclick="setResp('${k}')">${l}</button>`).join('');
  document.getElementById('sigGroups').innerHTML = Object.entries(SIGNALS).map(([cat, g]) => `
    <div class="cat" style="--c:${g.color}"><div class="cat-h">${g.label}</div>
      <div class="chips">${Object.entries(g.items).map(([k, l]) => `<button type="button" class="chip" style="--c:${g.color}" aria-pressed="false" data-k="${k}" onclick="toggleSig('${k}', this)">${l}</button>`).join('')}</div>
    </div>`).join('');
  resetForm();
}
function resetForm() {
  picked.clear(); resp = ''; sev = 0;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  document.querySelectorAll('#respBtns button, #sevSeg button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  ['uDur', 'uTemp', 'repNote'].forEach(id => document.getElementById(id).value = '');
  answeringFor = null;
  setTip(tip);
}
function setTip(t) {
  tip = t;
  document.getElementById('tipU').setAttribute('aria-pressed', t === 'uygulama');
  document.getElementById('tipS').setAttribute('aria-pressed', t === 'sinyal');
  document.getElementById('uygulamaCard').style.display = t === 'uygulama' ? '' : 'none';
  document.getElementById('sigTitle').innerHTML = t === 'sinyal' ? 'Gözlenen sinyaller' : 'Gözlenen sinyaller <span style="text-transform:none;font-weight:400">(varsa)</span>';
}
function setResp(k) { resp = resp === k ? '' : k; document.querySelectorAll('#respBtns button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === resp)); }
function setSev(v) { sev = sev === v ? 0 : v; document.querySelectorAll('#sevSeg button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.v) === sev)); }
function toggleSig(k, el) { picked.has(k) ? picked.delete(k) : picked.add(k); el.setAttribute('aria-pressed', picked.has(k)); }
function findAthlete() { const v = norm(document.getElementById('athleteInput').value); return athletes.find(a => norm(a.name) === v) || null; }
function athleteChanged() { const a = findAthlete(); document.getElementById('athleteHint').textContent = a ? `✓ ${a.pos || 'Sporcu'}` : ''; }

async function submitReport() {
  const a = findAthlete();
  if (!a) { toast('Listeden bir sporcu seçin', true); document.getElementById('athleteInput').focus(); return; }
  const note = document.getElementById('repNote').value.trim();
  if (tip === 'uygulama' && !resp) { toast('Sporcunun yanıtını seçin', true); return; }
  if (tip === 'sinyal' && !picked.size && !note) { toast('En az bir sinyal seçin veya not yazın', true); return; }
  if (picked.size && !sev) { toast('Sinyal şiddetini seçin', true); return; }
  const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = '⏳ Gönderiliyor…';
  try {
    const r = await postAPI({
      action:'addPhysioReport', athleteId: a.id, tip, tarih: document.getElementById('repDate').value,
      uygulama: tip === 'uygulama' ? document.getElementById('uType').value : '', bolge: tip === 'uygulama' ? document.getElementById('uRegion').value : '',
      sure: tip === 'uygulama' ? document.getElementById('uDur').value : '', sicaklik: tip === 'uygulama' ? document.getElementById('uTemp').value : '',
      yanit: tip === 'uygulama' ? resp : '', sinyaller: [...picked], siddet: sev, not: note, soruId: answeringFor || ''
    });
    if (!r.ok) throw new Error(r.error);
    toast('✅ Diyetisyene iletildi');
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    document.getElementById('athleteInput').value = ''; athleteChanged();
    resetForm();
  } catch (e) { toast('❌ Gönderilemedi: ' + e.message, true); }
  finally { btn.disabled = false; btn.textContent = '📨 Diyetisyene Gönder'; }
}

// ── Sorular ──
async function loadQuestions() {
  try {
    const r = await getAPI({ action:'getQuestions' });
    questions = (r.data || []).sort((x, y) => String(y.TarihSaat).localeCompare(String(x.TarihSaat)));
  } catch (e) { questions = []; }
  const open = questions.filter(q => q.Durum !== 'yanitlandi');
  const b = document.getElementById('qBadge');
  b.style.display = open.length ? 'flex' : 'none'; b.textContent = open.length;
  document.getElementById('qOpen').innerHTML = open.length ? open.map(q => `
    <div class="card" style="border-color:var(--yel)">
      <div class="item-h"><span>${q.SporcuAdi ? '👤 ' + esc(q.SporcuAdi) : 'Genel'}</span><span style="font-size:.72rem;color:var(--txt3)">${esc(String(q.TarihSaat).slice(0, 16))}</span></div>
      <div style="font-size:.9rem;margin:8px 0 10px;line-height:1.5">${esc(q.Soru)}</div>
      <textarea class="field" id="ans_${esc(q.ID)}" rows="2" placeholder="Yanıtınız…" maxlength="1000"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="answer('${esc(q.ID)}')">Yanıtla</button>
        ${q.SporcuID ? `<button class="btn sm outline" onclick="answerWithReport('${esc(q.ID)}','${esc(q.SporcuAdi)}')">Kayıt formuyla yanıtla</button>` : ''}
      </div>
    </div>`).join('') : '<div class="card empty">Açık soru yok 👍</div>';
  const done = questions.filter(q => q.Durum === 'yanitlandi').slice(0, 15);
  document.getElementById('qDone').innerHTML = done.length ? done.map(q => `
    <div class="item"><div class="item-h"><span>${q.SporcuAdi ? esc(q.SporcuAdi) : 'Genel'}</span><span style="font-size:.7rem;color:var(--txt3)">${esc(String(q.YanitTarih).slice(0, 16))}</span></div>
      <div class="item-m">S: ${esc(q.Soru)}</div><div style="font-size:.8rem;margin-top:4px">Y: ${esc(q.Yanit)}</div></div>`).join('') : '<div class="empty">Henüz yok</div>';
}
async function answer(id) {
  const ta = document.getElementById('ans_' + id), text = ta.value.trim();
  if (!text) { toast('Yanıt yazın', true); ta.focus(); return; }
  loading(true, 'Gönderiliyor…');
  try { const r = await postAPI({ action:'answerQuestion', questionId: id, answer: text }); if (!r.ok) throw new Error(r.error); toast('✅ Yanıt gönderildi'); loadQuestions(); }
  catch (e) { toast('❌ ' + e.message, true); } finally { loading(false); }
}
// Soruyu kayıt formuyla yanıtla: sporcu seçili olarak forma geç
function answerWithReport(id, athleteName) {
  switchPanel('new');
  document.getElementById('athleteInput').value = athleteName; athleteChanged();
  answeringFor = id;
  toast('Formu doldurup gönderin; ardından soruya kısa bir yanıt da yazabilirsiniz.');
}

// ── Geçmiş ──
async function loadHistory() {
  const el = document.getElementById('hist');
  el.innerHTML = '<div class="empty">Yükleniyor…</div>';
  try {
    const r = await getAPI({ action:'getPhysioReports', physioId: me.id, from: daysAgo(14) });
    const rows = (r.data || []).sort((x, y) => String(y.TarihSaat).localeCompare(String(x.TarihSaat)));
    el.innerHTML = rows.length ? rows.map(x => {
      let sig = []; try { sig = JSON.parse(x.Sinyaller || '[]'); } catch (e) {}
      const labels = sig.map(k => { const cat = Object.values(SIGNALS).find(g => g.items[k]); return cat ? `<span class="tag" style="--c:${cat.color}">${esc(cat.items[k])}</span>` : ''; }).join('');
      const fu = FOLLOW[x.TakipDurum];
      const rp = RESPONSES[x.Yanit];
      return `<div class="item">
        <div class="item-h"><span>${esc(x.SporcuAdi)}</span><span style="font-size:.7rem;color:var(--txt3)">${esc(x.Tarih)}</span></div>
        <div class="item-m">${x.Tip === 'uygulama' ? `${esc(APPS[x.Uygulama] || x.Uygulama)}${x.Sure ? ' · ' + esc(x.Sure) + ' dk' : ''}${rp ? ' · ' + rp[0] : ''}` : '🚩 Sinyal'}${Number(x.Siddet) ? ' · şiddet ' + ['', 'hafif', 'orta', 'ciddi'][Number(x.Siddet)] : ''}</div>
        <div>${labels}</div>
        ${x.Not ? `<div style="font-size:.78rem;margin-top:4px;color:var(--txt2)">“${esc(x.Not)}”</div>` : ''}
        ${fu ? `<div style="font-size:.75rem;margin-top:6px"><span class="tag" style="--c:${fu[1]}">Diyetisyen: ${fu[0]}</span>${x.TakipNot ? ' ' + esc(x.TakipNot) : ''}</div>` : ''}
      </div>`;
    }).join('') : '<div class="empty">Son 14 günde kayıt yok.</div>';
  } catch (e) { el.innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`; }
}

function switchPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  document.querySelectorAll('.nav-btn').forEach(b => { const on = b.id === 'nav-' + id; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  if (id === 'q') loadQuestions();
  if (id === 'h') loadHistory();
}
window.addEventListener('DOMContentLoaded', () => {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (s && s.id && s.token) { me = s; launch(); return; } } catch (e) {}
  document.getElementById('loginName').focus();
});
</script>
